    H 276
    C 336 98, 374 130, 374 182
    C 374 220, 348 246, 314 254
    C 358 262, 386 294, 386 342
    C 386 396, 340 414, 276 414
    H 144
    C 134 414, 126 406, 126 396
    Z

    M 204 162
    V 228
    H 268
    C 294 228, 310 214, 310 195
    C 310 176, 294 162, 268 162
    Z

    M 204 284
    V 352
    H 272
    C 300 352, 318 336, 318 318
    C 318 300, 300 284, 272 284
    Z
  " fill-rule="evenodd" fill="url(#bGrad)" />
</svg>